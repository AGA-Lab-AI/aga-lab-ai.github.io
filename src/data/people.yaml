  portrait: /images/site/pi-portrait.jpg     # optional larger (3:4) photo for the PI profile
  bio: >-
    I am an Assistant Professor at [UNIST Graduate School of AI](https://aigs.unist.ac.kr/eng/index.php),
    jointly affiliated with the [Department of Electrical Engineering](https://ee.unist.ac.kr/eng/).
    I was previously a Research Fellow at
    [University College London (UCL)](https://www.ucl.ac.uk/engineering/electronic-electrical-engineering)
    and [Korea Institute for Advanced Study (KIAS)](https://kias.re.kr/).
